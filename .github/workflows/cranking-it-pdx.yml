name: CRANKING IT .pdx

on:
  push:
    paths:
      - "cranking-it/source/**"
      - ".github/workflows/cranking-it-pdx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Playdate SDK
        run: |
          curl -fsSL -o sdk.tar.gz https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-latest.tar.gz
          mkdir sdk
          tar -xzf sdk.tar.gz -C sdk --strip-components=1
          echo "PLAYDATE_SDK_PATH=$PWD/sdk" >> "$GITHUB_ENV"
          echo "$PWD/sdk/bin" >> "$GITHUB_PATH"

      - name: Compile with pdc
        working-directory: cranking-it
        run: |
          pdc --version || true
          pdc source CrankingIt.pdx
          ls -la CrankingIt.pdx

      - name: Zip
        working-directory: cranking-it
        run: zip -r CrankingIt.pdx.zip CrankingIt.pdx

      - uses: actions/upload-artifact@v4
        with:
          name: CrankingIt.pdx
          path: cranking-it/CrankingIt.pdx.zip
          if-no-files-found: error

      # Also commit the zip to the branch, so it can be fetched with plain
      # git where artifact downloads are unavailable. (Pushes made with the
      # workflow token do not trigger another run.)
      - name: Commit the zip
        run: |
          mkdir -p cranking-it/build
          cp cranking-it/CrankingIt.pdx.zip cranking-it/build/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cranking-it/build/CrankingIt.pdx.zip
          git commit -m "CRANKING IT: built CrankingIt.pdx.zip" || exit 0
          git push

  # Plays every machine and mode in Panic's Linux Simulator under a virtual
  # display, driven by tools/sim_autotest.lua, and fails on any Lua error.
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the Playdate SDK and Simulator dependencies
        run: |
          curl -fsSL -o sdk.tar.gz https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-latest.tar.gz
          mkdir sdk
          tar -xzf sdk.tar.gz -C sdk --strip-components=1
          echo "PLAYDATE_SDK_PATH=$PWD/sdk" >> "$GITHUB_ENV"
          echo "$PWD/sdk/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0t64 libwebkit2gtk-4.1-0 libasound2t64 libpulse0 >/dev/null
          ls sdk/bin
          ldd sdk/bin/PlaydateSimulator | grep "not found" || true

      - name: Build the autotest .pdx
        working-directory: cranking-it
        run: |
          cp -r source autotest-src
          cp tools/sim_autotest.lua autotest-src/sim_autotest.lua
          printf '\nimport "sim_autotest"\n' >> autotest-src/main.lua
          pdc autotest-src Autotest.pdx

      - name: Run it in the Simulator
        working-directory: cranking-it
        run: |
          set +e
          export SDL_AUDIODRIVER=dummy
          timeout 600 xvfb-run -a "$PLAYDATE_SDK_PATH/bin/PlaydateSimulator" "$PWD/Autotest.pdx" > sim.log 2>&1
          echo "simulator exit code $?"
          grep -E "AUTOTEST|error|Error" sim.log | head -200
          echo "---- tail of simulator output"
          tail -40 sim.log
          f=$(find "$PLAYDATE_SDK_PATH/Disk/Data" -name 'autotest.json' 2>/dev/null | head -1)
          echo "---- datastore: $f"
          [ -n "$f" ] && cat "$f"
          set -e
          test -n "$f"
          grep -q '"errors":0' "$f" || grep -q '"errors": 0' "$f"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-log
          path: cranking-it/sim.log
